<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Primer V05 production review</title>
<style>body{margin:0;background:#071820;color:#ffebbf;font:16px system-ui;padding:24px}video{width:100%;max-height:calc(100vh - 350px);min-height:240px;background:#000}button,select{font:inherit;padding:10px;margin:8px;background:#ffe5a3;border:0;border-radius:8px}p{max-width:900px}</style>
<h1>Maya / Fortuna — production review</h1><p>Complete V05 film. Select a reviewed source clip or play the full preview with both counteroffers. The app supplies the Yes/No choices.</p>
<select id="shots" aria-label="Clip"></select><button id="load">Load clip</button><button id="preview">Full preview</button><button id="next">Next clip</button><p id="status" aria-live="polite"></p><video id="video" controls playsinline preload="metadata"></video>
<script>
const video=document.querySelector('video'),select=document.querySelector('select'),status=document.querySelector('#status');
fetch('shots.json').then(r=>r.json()).then(m=>{for(const s of m.scenes){const o=document.createElement('option');o.value=s.id;o.textContent=s.id+' — '+(s.line||s.action);select.append(o);}load();});
function load(){video.src='sources/'+select.value+'.mp4';status.textContent='Reviewing '+select.value;video.load();}
document.querySelector('#load').onclick=load;document.querySelector('#next').onclick=()=>{select.selectedIndex=Math.min(select.options.length-1,select.selectedIndex+1);load();};
document.querySelector('#preview').onclick=()=>{video.src='preview20.mp4';video.innerHTML='<track kind="captions" src="preview20.en.vtt" srclang="en" label="English" default>';status.textContent='Complete two-No review path';video.load();};
video.addEventListener('timeupdate',()=>{status.textContent='Time '+video.currentTime.toFixed(2)+' / '+(Number.isFinite(video.duration)?video.duration.toFixed(2):'?');});video.addEventListener('error',()=>{status.textContent='This clip is not ready yet.';});
</script></html>
